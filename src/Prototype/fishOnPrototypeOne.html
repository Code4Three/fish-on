/* ============================================================
   SYNTHETIC MARINE DATA GENERATOR (deterministic per day offset)
   ============================================================ */
function mulberry32(seed) {
  let a = seed >>> 0;
  return function () {
    a |= 0; a = (a + 0x6D2B79F5) | 0;
    let t = Math.imul(a ^ (a >>> 15), 1 | a);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}

const COMPASS = ["N","NNE","NE","ENE","E","ESE","SE","SSE","S","SSW","SW","WSW","W","WNW","NW","NNW"];
const MOON_PHASES = ["New Moon","Waxing Crescent","First Quarter","Waxing Gibbous","Full Moon","Waning Gibbous","Last Quarter","Waning Crescent"];
const TIDE_PERIOD = 12.42;
const TIDE_MEAN = 1.3;
const TIDE_AMP = 0.85;

function normHour(h) { return ((h % 24) + 24) % 24; }

function tideHeightAt(t, phase) {
  return TIDE_MEAN + TIDE_AMP * Math.sin(((2 * Math.PI) / TIDE_PERIOD) * t + phase);
}
function tideSlopeAt(t, phase) {
  return TIDE_AMP * ((2 * Math.PI) / TIDE_PERIOD) * Math.cos(((2 * Math.PI) / TIDE_PERIOD) * t + phase);
}

function formatClock(hDecimal) {
  const h = normHour(hDecimal);
  const hh = Math.floor(h);
  const mm = Math.round((h - hh) * 60);
  const period = hh >= 12 ? "PM" : "AM";
  let display = hh % 12;
  if (display === 0) display = 12;
  return `${display}:${String(mm).padStart(2, "0")} ${period}`;
}
function formatHourShort(h) {
  const period = h >= 12 ? "PM" : "AM";
  let display = h % 12;
  if (display === 0) display = 12;
  return `${display} ${period}`;
}

function generateDayData(offset) {
  const rand = mulberry32(1000 + offset * 7919);
  const phase = ((offset * 0.85) % (2 * Math.PI)) + rand() * 0.6;

  // hourly tide + wind
  const windBase = 8 + rand() * 9;
  const windDirBase = Math.floor(rand() * 16);
  const hours = [];
  for (let h = 0; h < 24; h++) {
    const speed = Math.max(3, windBase + 4.5 * Math.sin((h / 24) * Math.PI * 2 + 1) + (rand() - 0.5) * 3);
    const gust = speed + 3 + rand() * 4;
    const dirIdx = (windDirBase + Math.floor(h / 4)) % 16;
    hours.push({
      hour: h,
      tideHeight: tideHeightAt(h, phase),
      wind: { speed: Math.round(speed), gust: Math.round(gust), dir: COMPASS[dirIdx] },
      solunar: "none",
    });
  }

  // tide events via slope sign change
  const events = [];
  let prevSlope = tideSlopeAt(0, phase);
  const stepsPerHour = 12;
  for (let i = 1; i <= 24 * stepsPerHour; i++) {
    const t = i / stepsPerHour;
    const slope = tideSlopeAt(t, phase);
    if ((prevSlope > 0 && slope <= 0) || (prevSlope < 0 && slope >= 0)) {
      const type = prevSlope > 0 ? "High" : "Low";
      events.push({ hour: t, type, height: +tideHeightAt(t, phase).toFixed(1) });
    }
    prevSlope = slope;
  }

  // solunar: one major window (moon transit) + two minor windows (rise/set)
  const transit = normHour(offset * 3.7 + rand() * 5);
  const moonrise = normHour(transit - 6.2);
  const moonset = normHour(transit + 6.2);
  const majorWindow = { start: transit - 1, end: transit + 1 };
  const minorWindows = [
    { start: moonrise - 0.75, end: moonrise + 0.75 },
    { start: moonset - 0.75, end: moonset + 0.75 },
  ];

  const overlaps = (aStart, aEnd, bStart, bEnd) => {
    const norm = (x) => normHour(x);
    // simple overlap check treating ranges within [-2,26] band, good enough for demo
    return Math.max(aStart, bStart) < Math.min(aEnd, bEnd);
  };
  hours.forEach((hr) => {
    const hs = hr.hour, he = hr.hour + 1;
    let level = "none";
    if (overlaps(hs, he, majorWindow.start, majorWindow.end)) level = "major";
    else if (minorWindows.some((w) => overlaps(hs, he, w.start, w.end))) level = "minor";
    hr.solunar = level;
  });

  const moonPhaseIdx = ((offset % 8) + 8) % 8;
  const moonIllum = Math.round(((1 - Math.cos((moonPhaseIdx / 8) * 2 * Math.PI)) / 2) * 100);
  const solunarRating = Math.max(35, Math.min(99, Math.round(52 + (moonIllum / 100) * 28 + rand() * 18)));

  const pressureVal = Math.round(1000 + rand() * 25);
  const pressureTrend = ["Rising", "Falling", "Steady"][Math.floor(rand() * 3)];
  const rainChance = Math.round(rand() * 55);

  return {
    offset,
    phase,
    hours,
    tideEvents: events,
    majorWindow,
    minorWindows,
    solunarRating,
    secondary: {
      pressure: { value: pressureVal, trend: pressureTrend },
      waterTemp: (20 + rand() * 6).toFixed(1),
      swell: { height: (0.5 + rand() * 1.5).toFixed(1), period: Math.round(6 + rand() * 6), dir: COMPASS[Math.floor(rand() * 16)] },
      moon: { phaseName: MOON_PHASES[moonPhaseIdx], illum: moonIllum },
      rain: { chance: rainChance, mm: rainChance > 40 ? +(rand() * 4).toFixed(1) : 0 },
      uv: Math.max(1, Math.min(11, Math.round(1 + rand() * 10))),
      airTemp: { temp: Math.round(18 + rand() * 9), feels: Math.round(18 + rand() * 9) + Math.round(rand() * 2) },
    },
  };
}

function uvLabel(uv) {
  if (uv <= 2) return "Low";
  if (uv <= 5) return "Moderate";
  if (uv <= 7) return "High";
  if (uv <= 10) return "Very High";
  return "Extreme";
}
function ratingTier(pct) {
  if (pct >= 80) return "Peak";
  if (pct >= 60) return "Good";
  if (pct >= 40) return "Fair";
  return "Slow";
}
function solunarLabel(level) {
  if (level === "major") return "Major Solunar Window";
  if (level === "minor") return "Minor Solunar Window";
  return "Low Solunar Activity";
}
function formatDateLabel(offset) {
  const base = new Date(2026, 8, 21); // Mon, 21 Sep 2026 = "today"
  const d = new Date(base);
  d.setDate(base.getDate() + offset);
  const day = d.getDate();
  const month = d.toLocaleDateString("en-AU", { month: "short" });
  const weekday = d.toLocaleDateString("en-AU", { weekday: "short" });
  if (offset === 0) return `Today, ${day} ${month}`;
  if (offset === 1) return `Tomorrow, ${day} ${month}`;
  if (offset === -1) return `Yesterday, ${day} ${month}`;
  return `${weekday}, ${day} ${month}`;
}

function TimeBar({ hour, setHour, hourData, onOpenDayView }) {
  const scrollerRef = useRef(null);
  const pillRefs = useRef({});

  useEffect(() => {
    const el = pillRefs.current[hour];
    if (el && scrollerRef.current) {
      el.scrollIntoView({ behavior: "smooth", inline: "center", block: "nearest" });
    }
  }, [hour]);

  return (
    <div className="px-4 pt-4">
      <div className="flex items-center justify-between">
        <StepButton onClick={() => setHour(Math.max(0, hour - 1))} disabled={hour === 0} dir="left" label="Prev Hour" />
        <div className="text-center leading-tight">

          </p>
        </div>
        <StepButton onClick={() => setHour(Math.min(23, hour + 1))} disabled={hour === 23} dir="right" label="Next Hour" />
      </div>

      <div ref={scrollerRef} className="mt-3 flex gap-2 overflow-x-auto no-scrollbar pb-1 -mx-4 px-4">

          const active = h === hour;
          return (
            <button
              key={h}
              ref={(el) => (pillRefs.current[h] = el)}
              onClick={() => setHour(h)}
              className={
                "shrink-0 h-11 px-4 rounded-full font-body text-[13.5px] font-semibold flex items-center transition-colors " +

      >
        <Icon name="clock" size={17} />
        View Full Day (24h)
      </button>
    </div>
  );
}

/* ============================================================
   HERO CARDS
   ============================================================ */
function TideSparkline({ hours, min, max, hour }) {
  const w = 280, h = 46;
  const pts = hours.map((hr, i) => {
    const x = (i / (hours.length - 1)) * w;
    const y = h - ((hr.tideHeight - min) / (max - min || 1)) * h;
    return `${x.toFixed(1)},${y.toFixed(1)}`;
  });
  const markerX = (hour / (hours.length - 1)) * w;
  const markerY = h - ((hours[hour].tideHeight - min) / (max - min || 1)) * h;
  return (
    <svg viewBox={`0 0 ${w} ${h}`} className="w-full h-12 mt-3" preserveAspectRatio="none">
      <polyline points={pts.join(" ")} fill="none" stroke="#22C58A" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" opacity="0.55" />
      <circle cx={markerX} cy={markerY} r="4.5" fill="#4ADE9C" stroke="#070B13" strokeWidth="2" />
    </svg>
  );
}

function TideHeroCard({ day, hour }) {
  const height = tideHeightAt(hour, day.phase);
  const slope = tideSlopeAt(hour, day.phase);
  const rising = slope > 0;
  const heights = day.hours.map((h) => h.tideHeight);
  const min = Math.min(...heights), max = Math.max(...heights);

  const nextEvent = day.tideEvents.find((e) => e.hour >= hour) || day.tideEvents[0];
  const nextLabel = nextEvent
    ? `${nextEvent.type}: ${formatClock(nextEvent.hour)} (${nextEvent.height.toFixed(1)}m)${nextEvent.hour >= 24 ? " · tmrw" : ""}`
    : "—";

  return (
    <div className="relative mx-4 mt-4 rounded-3xl overflow-hidden bg-gradient-to-b from-hull-800 to-hull-900 border border-hull-700/70">
      <svg className="absolute inset-x-0 bottom-0 w-full h-16 opacity-[0.07]" viewBox="0 0 400 60" preserveAspectRatio="none">
        <path d="M0 30 Q 50 5 100 30 T 200 30 T 300 30 T 400 30 V60 H0 Z" fill="#4ADE9C" />
      </svg>
      <div className="relative px-5 pt-5 pb-4">
        <div className="flex items-center gap-1.5 text-slate-400 font-body text-[13px]">
          <Icon name="waves" size={15} className="text-tide-400" />
          <span>Tide height</span>
        </div>

        <div className="mt-1 flex items-baseline gap-3 flex-wrap">
          <span className="font-display font-bold text-white text-[56px] leading-none tabular">
            {height.toFixed(1)}<span className="text-2xl align-top ml-0.5 text-slate-400 font-medium">m</span>
          </span>
          <span className={"inline-flex items-center gap-1 rounded-full px-3 py-1.5 text-sm font-semibold font-body " + (rising ? "bg-tide-500/15 text-tide-400" : "bg-amber-400/15 text-amber-300")}>
            <Icon name={rising ? "trending-up" : "trending-down"} size={16} />
            {rising ? "Rising" : "Falling"}
          </span>
        </div>

        <TideSparkline hours={day.hours} min={min} max={max} hour={hour} />

        <div className="mt-2 pt-3 border-t border-hull-700/70 flex items-center justify-between">
          <span className="text-[13.5px] text-slate-300 font-body font-medium">Next {nextEvent ? nextEvent.type.toLowerCase() : ""} tide</span>
          <span className="text-[13.5px] text-white font-body font-semibold tabular">{nextLabel}</span>
        </div>
      </div>
    </div>
  );
}

function SolunarHeroCard({ day }) {
  const tier = ratingTier(day.solunarRating);
  const tierColor = tier === "Peak" ? "bg-tide-500/15 text-tide-400" : tier === "Good" ? "bg-amber-400/15 text-amber-300" : "bg-slate-500/15 text-slate-300";
  return (
    <div className="relative mx-4 mt-3 rounded-3xl overflow-hidden bg-hull-800 border border-hull-700/70">
      <div className="relative px-5 pt-5 pb-4">
        <div className="flex items-center gap-1.5 text-slate-400 font-body text-[13px]">
          <Icon name="moon" size={15} className="text-indigo-300" />
          <span>Solunar rating</span>
        </div>
        <div className="mt-1 flex items-baseline gap-3 flex-wrap">
          <span className="font-display font-bold text-white text-[44px] leading-none tabular">
            {day.solunarRating}<span className="text-xl align-top ml-0.5 text-slate-400 font-medium">%</span>
          </span>
          <span className={"inline-flex items-center gap-1 rounded-full px-3 py-1.5 text-sm font-semibold font-body " + tierColor}>
            <Icon name="fish" size={16} />
            {tier}
          </span>
        </div>
        <div className="mt-3 pt-3 border-t border-hull-700/70 flex items-center justify-between gap-3">
          <div className="flex items-center gap-2.5 min-w-0">
            <div className="w-9 h-9 rounded-full bg-white/5 flex items-center justify-center text-slate-300 shrink-0">
              <Icon name="fish" size={17} />
            </div>
            <div className="leading-tight min-w-0">
              <p className="text-[12px] text-slate-500 font-body">Active feeding window</p>
              <p className="font-display font-semibold text-white text-[15px] truncate">
                Major: {formatClock(day.majorWindow.start)} – {formatClock(day.majorWindow.end)}
              </p>
            </div>
          </div>
        </div>
      </div>
    </div>
  );
}

/* ============================================================
   SECONDARY METRIC GRID
   ============================================================ */
function MetricCard({ def, day, hourWind, spanFull }) {
  const r = def.render({ secondary: day.secondary, hourWind });
  return (
    <div className={"rounded-2xl bg-hull-800 border border-hull-700/70 p-4 min-h-[112px] flex flex-col justify-between " + (spanFull ? "col-span-2" : "")}>
      <div className="flex items-center gap-2">
        <div className={"w-8 h-8 rounded-full flex items-center justify-center " + def.ring}>
          <Icon name={def.icon} size={16} className={def.tint} strokeWidth={2.25} />
        </div>
        <p className="text-[12px] text-slate-400 font-body leading-tight">{def.label}</p>
      </div>
      <div>
        <p className="font-display font-bold text-white text-[26px] leading-none tabular">
          {r.value}{r.unit && <span className="text-[15px] font-medium text-slate-400 ml-1">{r.unit}</span>}
        </p>
        <p className="text-[11.5px] text-slate-500 font-body mt-1.5 truncate">{r.detail}</p>
      </div>
    </div>
  );
}

function SecondaryGrid({ day, hour, visibility }) {
  const hourWind = day.hours[hour].wind;
  const visibleDefs = SECONDARY_DEFS.filter((d) => visibility[d.id]);
  const oddOut = visibleDefs.length % 2 === 1;

  return (
    <div className="px-4 mt-4">
      <p className="text-[12.5px] text-slate-500 mb-2 px-0.5">Conditions at {formatHourShort(hour)}</p>
      {visibleDefs.length === 0 ? (
        <div className="rounded-2xl border border-dashed border-hull-700 py-8 text-center text-slate-500 text-sm">
          All secondary metrics are hidden — tap the gear icon to bring some back.
        </div>
      ) : (
        <div className="grid grid-cols-2 gap-3">
          {visibleDefs.map((def, i) => (
            <MetricCard key={def.id} def={def} day={day} hourWind={hourWind} spanFull={oddOut && i === visibleDefs.length - 1} />
          ))}
        </div>
      )}
    </div>
  );
}

/* ============================================================
   24-HOUR DAY VIEW DRAWER
   ============================================================ */
function DayViewDrawer({ open, onClose, day, offset, selectedHour, onPickHour }) {
  return (
    <>
      <div
        onClick={onClose}
        className={"fixed inset-0 bg-black/60 z-30 transition-opacity duration-300 " + (open ? "opacity-100 pointer-events-auto" : "opacity-0 pointer-events-none")}
      />
      <div
        className={"fixed left-0 right-0 bottom-0 z-40 max-w-md mx-auto rounded-t-3xl bg-hull-900 border-t border-hull-700 transition-transform duration-300 ease-out flex flex-col " + (open ? "translate-y-0" : "translate-y-full")}
        style={{ height: "82vh", paddingBottom: "env(safe-area-inset-bottom, 0px)" }}
        role="dialog" aria-modal="true" aria-label="Full day forecast"
      >
        <div className="flex justify-center pt-3 shrink-0">
          <div className="w-10 h-1.5 rounded-full bg-hull-600" />
        </div>
        <div className="flex items-center justify-between px-5 pt-3 pb-2 shrink-0">
          <div>
            <h2 className="font-display font-semibold text-white text-lg leading-tight">Full day forecast</h2>
            <p className="text-[12.5px] text-slate-500 font-body">{formatDateLabel(offset)} · tap a row to jump there</p>
          </div>
          <button onClick={onClose} aria-label="Close full day view" className="w-12 h-12 -mr-2 rounded-full flex items-center justify-center text-slate-400 active:bg-hull-800 active:text-white transition-colors">
            <Icon name="x" size={22} />
          </button>
        </div>

        <div className="grid grid-cols-[64px_1fr_1.3fr_1.3fr] gap-2 px-5 py-2 text-[11px] uppercase tracking-wide text-slate-500 font-body border-b border-hull-700/70 shrink-0">
          <span>Time</span>
          <span>Tide</span>
          <span>Solunar</span>
          <span>Wind</span>
        </div>

        <div className="flex-1 overflow-y-auto px-5 pb-4 divide-y divide-hull-700/50">
          {day.hours.map((hr) => {
            const active = hr.hour === selectedHour;
            return (
              <button
                key={hr.hour}
                onClick={() => onPickHour(hr.hour)}
                className={"w-full grid grid-cols-[64px_1fr_1.3fr_1.3fr] gap-2 py-3 text-left min-h-[48px] items-center rounded-lg transition-colors " + (active ? "bg-tide-500/10" : "active:bg-hull-800")}
              >
                <span className={"font-body text-[13px] font-semibold tabular " + (active ? "text-tide-400" : "text-white")}>{formatHourShort(hr.hour)}</span>
                <span className="font-body text-[13px] text-slate-300 tabular">{hr.tideHeight.toFixed(1)}m</span>
                <span className={"font-body text-[12.5px] font-medium " + (hr.solunar === "major" ? "text-tide-400" : hr.solunar === "minor" ? "text-amber-300" : "text-slate-500")}>
                  {hr.solunar === "major" ? "Major" : hr.solunar === "minor" ? "Minor" : "—"}
                </span>
                <span className="font-body text-[12.5px] text-slate-300 tabular">{hr.wind.speed}kt {hr.wind.dir}</span>
              </button>
            );
          })}
        </div>
      </div>
    </>
  );
}

/* ============================================================
   SETTINGS BOTTOM SHEET
   ============================================================ */
function SettingsSheet({ open, onClose, visibility, setVisibility, onReset }) {
  return (
    <>
      <div
        onClick={onClose}
        className={"fixed inset-0 bg-black/60 z-30 transition-opacity duration-300 " + (open ? "opacity-100 pointer-events-auto" : "opacity-0 pointer-events-none")}
      />
      <div
        className={"fixed left-0 right-0 bottom-0 z-40 max-w-md mx-auto rounded-t-3xl bg-hull-900 border-t border-hull-700 transition-transform duration-300 ease-out max-h-[85vh] flex flex-col " + (open ? "translate-y-0" : "translate-y-full")}
        style={{ paddingBottom: "env(safe-area-inset-bottom, 0px)" }}
        role="dialog" aria-modal="true" aria-label="Display settings"
      >
        <div className="flex justify-center pt-3 shrink-0">
          <div className="w-10 h-1.5 rounded-full bg-hull-600" />
        </div>
        <div className="flex items-center justify-between px-5 pt-3 pb-1 shrink-0">
          <h2 className="font-display font-semibold text-white text-lg">Customize display</h2>
          <button onClick={onClose} aria-label="Close settings" className="w-12 h-12 -mr-2 rounded-full flex items-center justify-center text-slate-400 active:bg-hull-800 active:text-white transition-colors">
            <Icon name="x" size={22} />
          </button>
        </div>
        <p className="px-5 text-[13px] text-slate-500 font-body -mt-1 mb-1 shrink-0">
          Tide height and solunar rating always show.
        </p>

        <div className="px-5 pb-2 divide-y divide-hull-700/70 overflow-y-auto">
          {SECONDARY_DEFS.map((def) => (
            <div key={def.id} className="flex items-center justify-between py-3 min-h-[56px]">
              <div className="flex items-center gap-3 min-w-0">
                <div className={"w-9 h-9 rounded-full flex items-center justify-center shrink-0 " + def.ring}>
                  <Icon name={def.icon} size={17} className={def.tint} />
                </div>
                <span className="font-body text-white text-[15px] font-medium truncate">{def.label}</span>
              </div>
              <ToggleSwitch
                checked={visibility[def.id]}
                onChange={(v) => setVisibility((prev) => ({ ...prev, [def.id]: v }))}
                label={"Toggle " + def.label}
              />
            </div>
          ))}
        </div>

        <div className="flex gap-3 px-5 pt-3 pb-6 shrink-0">
          <button onClick={onReset} className="flex-1 h-12 rounded-xl border border-hull-600 text-slate-300 font-body font-semibold text-[15px] flex items-center justify-center gap-2 active:bg-hull-800 transition-colors">
            <Icon name="rotate-ccw" size={16} />
            Reset to defaults
          </button>
          <button onClick={onClose} className="flex-1 h-12 rounded-xl bg-tide-500 text-hull-950 font-body font-semibold text-[15px] active:bg-tide-600 transition-colors">
            Done
          </button>
        </div>
      </div>
    </>
  );
}

/* ============================================================
   APP
   ============================================================ */
function App() {
  const [dateOffset, setDateOffset] = useState(0);
  const [hour, setHour] = useState(7);
  const [settingsOpen, setSettingsOpen] = useState(false);
  const [dayViewOpen, setDayViewOpen] = useState(false);
  const [visibility, setVisibility] = useState(DEFAULT_VISIBILITY);

  const day = useMemo(() => generateDayData(dateOffset), [dateOffset]);
  // fallback source for a next-tide event that falls after the last event of the day
  const nextDay = useMemo(() => generateDayData(dateOffset + 1), [dateOffset]);
  const dayWithFallback = useMemo(() => {
    if (day.tideEvents.some((e) => e.hour >= hour)) return day;
    return { ...day, tideEvents: [...day.tideEvents, ...nextDay.tideEvents.map((e) => ({ ...e, hour: e.hour + 24 }))] };
  }, [day, nextDay, hour]);

  const hourData = day.hours[hour];

  return (
    <div className="min-h-screen bg-hull-950 max-w-md mx-auto font-body pb-10">
      <Header onOpenSettings={() => setSettingsOpen(true)} />
      <DateBar offset={dateOffset} setOffset={setDateOffset} />

      <TimeBar hour={hour} setHour={setHour} hourData={hourData} onOpenDayView={() => setDayViewOpen(true)} />

      <TideHeroCard day={dayWithFallback} hour={hour} />
      <SolunarHeroCard day={day} />

      <SecondaryGrid day={day} hour={hour} visibility={visibility} />

      <DayViewDrawer
        open={dayViewOpen}
        onClose={() => setDayViewOpen(false)}
        day={day}
        offset={dateOffset}
        selectedHour={hour}
        onPickHour={(h) => { setHour(h); setDayViewOpen(false); }}
      />

      <SettingsSheet
        open={settingsOpen}
        onClose={() => setSettingsOpen(false)}
        visibility={visibility}
        setVisibility={setVisibility}
        onReset={() => setVisibility(DEFAULT_VISIBILITY)}
      />
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App />);
</script>
</body>
</html>
